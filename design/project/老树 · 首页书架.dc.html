<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老树 · 千年书架</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Spectral:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
  <style>
    body { margin:0; background: var(--paper); transition: background-color .5s ease;
      --paper:#F7F4EC; --ink:#1F1D1A; --ink-light:#8A8578; --cinnabar:#B03A2E; --seal:#7A241B;
      --verdigris:#5E7A6B; --line:rgba(31,29,26,.14); --u-soft:rgba(176,58,46,.32); }
    body[data-night="1"] { --paper:#15161A; --ink:#E8E3D6; --ink-light:#7E7A6E; --cinnabar:#C9564A; --seal:#D8776C;
      --line:rgba(232,227,214,.13); --u-soft:rgba(201,86,74,.42); }
    @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cardIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
    ::selection { background: rgba(176,58,46,.18); }
    @media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</helmet>
<div style="min-height:100vh; font-family:'Noto Sans SC',sans-serif; color:var(--ink); display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:26px 44px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--cinnabar)" stroke-width="1"></circle><circle cx="11" cy="11" r="5.5" fill="none" stroke="var(--cinnabar)" stroke-width="0.8" opacity="0.65"></circle><circle cx="11" cy="11" r="2" fill="none" stroke="var(--cinnabar)" stroke-width="0.7" opacity="0.4"></circle></svg>
      <span style="font-family:'Noto Serif SC',serif; font-size:17px; font-weight:500; letter-spacing:0.3em; color:var(--ink);">老树</span>
      <span style="font-size:12px; color:var(--ink-light); letter-spacing:0.08em; margin-left:4px;">千年经典的活体年轮库</span>
    </div>
    <div style="display:flex; gap:28px; font-size:13px; color:var(--ink-light);">
      <a href="老树 · 考据.dc.html" style="color:var(--ink-light); text-decoration:none; transition:color .3s ease;" style-hover="color: var(--ink)">考据</a>
      <span onClick="{{ toggleNight }}" style="cursor:pointer; transition:color .3s ease;" style-hover="color: var(--ink)">{{ nightLabel }}</span>
      <span style="cursor:pointer; transition:color .3s ease;" style-hover="color: var(--ink)">登录</span>
    </div>
  </div>

  <div data-screen-label="千年书架" style="position:relative; flex:1; min-height:600px;">

    <div style="position:absolute; top:9%; left:44px; max-width:520px;">
      <div style="font-family:'Noto Serif SC',serif; font-size:27px; letter-spacing:0.08em; line-height:1.8;">一座还在生长的碑林。</div>
      <div style="margin-top:14px; font-size:13px; line-height:1.9; color:var(--ink-light); letter-spacing:0.04em;">AI 长出土壤,人在其上署名落笔,时间让字入木。<br>免登录,全站可读。</div>
    </div>

    <div style="position:absolute; left:64px; right:64px; bottom:26%;">
      <div style="position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--line);"></div>

      <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="8">
        <div style="position:absolute; bottom:-4px; left: {{ t.pct }};">
          <div style="width:1px; height:6px; background:var(--line); margin:0 auto;"></div>
          <div style="margin-top:8px; transform:translateX(-50%); font-family:Spectral,'Noto Sans SC',serif; font-feature-settings:'onum'; font-size:11px; white-space:nowrap; color: {{ t.c }};">{{ t.label }}</div>
        </div>
      </sc-for>

      <sc-for list="{{ ghosts }}" as="g" hint-placeholder-count="3">
        <div style="position:absolute; bottom:2px; left: {{ g.pct }}; width: {{ g.w }}; height: {{ g.h }}; margin-left: {{ g.ml }}; border:1px dashed var(--line); box-sizing:border-box; opacity:0; animation: fadeIn 1.2s ease-out both; animation-delay: {{ g.delay }};"></div>
      </sc-for>

      <sc-for list="{{ books }}" as="b" hint-placeholder-count="3">
        <div onMouseEnter="{{ b.enter }}" onMouseLeave="{{ b.leave }}" style="position:absolute; bottom:2px; left: {{ b.pct }}; width: {{ b.w }}; height: {{ b.h }}; margin-left: {{ b.ml }};">
          <div style="width:100%; height:100%; transform-origin:bottom; animation: growUp 0.7s cubic-bezier(0.22,1,0.36,1) both; animation-delay: {{ b.delay }};">
            <a href="{{ b.href }}" onClick="{{ b.click }}" style="position:relative; display:flex; align-items:center; justify-content:center; width:100%; height:100%; box-sizing:border-box; border:1px solid var(--ink); background:var(--paper); text-decoration:none; color:var(--ink); cursor:pointer; transition: transform .3s ease, background-color .5s ease;" style-hover="transform: translateY(-6px)">
              <div style="position:absolute; top:8px; bottom:8px; left:5px; width:1px; background:var(--line);"></div>
              <div style="position:absolute; top:8px; bottom:8px; right:5px; width:1px; background:var(--line);"></div>
              <span style="writing-mode:vertical-rl; font-family:'Noto Serif SC',serif; font-size: {{ b.fs }}; letter-spacing:0.4em; line-height:1;">{{ b.title }}</span>
              <sc-if value="{{ b.seal }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute; bottom:10px; left:50%; margin-left:-3px; width:6px; height:6px; background:var(--cinnabar);"></div>
              </sc-if>
            </a>
          </div>
          <sc-if value="{{ b.hovered }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; bottom: calc(100% + 20px); left:50%; transform:translateX(-50%); width:264px; background:var(--paper); border:0.5px solid var(--line); border-radius:8px; padding:18px 20px; box-shadow:0 10px 30px rgba(31,29,26,0.08); animation: cardIn 0.3s ease-out both; z-index:5;">
              <div style="font-family:'Noto Serif SC',serif; font-size:17px; letter-spacing:0.12em; margin-bottom:8px;">{{ b.title }}</div>
              <div style="font-family:'Noto Serif SC',serif; font-size:13.5px; line-height:1.8; color:var(--ink); margin-bottom:10px;">{{ b.line }}</div>
              <div style="font-family:Spectral,'Noto Sans SC',serif; font-feature-settings:'onum'; font-size:12px; color:var(--ink-light); margin-bottom:12px;">{{ b.meta }}</div>
              <div style="font-size:12px; letter-spacing:0.12em; color: {{ b.ctaC }};">{{ b.cta }}</div>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="position:absolute; left:64px; bottom:8%; font-size:12px; letter-spacing:0.2em; color:var(--ink-light);">越老的书,年轮越厚。</div>
    <div style="position:absolute; right:64px; bottom:8%; font-size:12px; letter-spacing:0.12em; color:var(--ink-light); text-align:right;">书架尚空。空不是缺陷,是等待被种下的余地。</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;night&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;氛围&quot;}
}">
class Component extends DCLogic {
  MIN = -600;
  MAX = 2026;

  state = { night: false, hover: null };

  bookData = [
    { id: 'ddj', title: '道德經', y: -400, w: '38px', h: '236px', fs: '16px', delay: '0.35s', seal: true,
      line: '五千字,两千年读不尽。', meta: '已生长约 2,400 年 · 137 层年轮',
      cta: '走进这本书 →', href: '老树 · 道德经.dc.html', live: true },
    { id: 'ly', title: '論語', y: -480, w: '26px', h: '212px', fs: '14px', delay: '0.55s',
      line: '半部,治天下。', meta: '已生长约 2,500 年 · 待种下',
      cta: '即将种下', href: '', live: false },
    { id: 'zz', title: '莊子', y: -300, w: '20px', h: '192px', fs: '13px', delay: '0.75s',
      line: '谬悠之说,荒唐之言,无端崖之辞。', meta: '已生长约 2,300 年 · 待种下',
      cta: '即将种下', href: '', live: false }
  ];

  ghostData = [
    { y: 100,  w: '14px', h: '150px', delay: '1.1s' },
    { y: 700,  w: '16px', h: '160px', delay: '1.25s' },
    { y: 1050, w: '13px', h: '140px', delay: '1.4s' },
    { y: 1600, w: '15px', h: '150px', delay: '1.55s' }
  ];

  componentDidMount() {
    const night = !!this.props.night;
    if (night) document.body.setAttribute('data-night', '1');
    this.setState({ night });
  }

  renderVals() {
    const st = this.state;
    const pct = (y) => (((y - this.MIN) / (this.MAX - this.MIN)) * 100).toFixed(2) + '%';

    const ticks = [];
    for (let y = -600; y <= 2000; y += 200) {
      ticks.push({ pct: pct(y), label: y < 0 ? '前 ' + (-y) : String(y === 0 ? 1 : y), c: 'var(--ink-light)' });
    }
    ticks.push({ pct: pct(2026), label: '今', c: 'var(--cinnabar)' });

    const half = (w) => '-' + (parseInt(w, 10) / 2) + 'px';

    const books = this.bookData.map(b => Object.assign({}, b, {
      pct: pct(b.y), ml: half(b.w),
      hovered: st.hover === b.id,
      ctaC: b.live ? 'var(--cinnabar)' : 'var(--verdigris)',
      enter: () => this.setState({ hover: b.id }),
      leave: () => this.setState({ hover: null }),
      click: b.live ? null : (e) => e.preventDefault()
    }));

    const ghosts = this.ghostData.map(g => Object.assign({}, g, { pct: pct(g.y), ml: half(g.w) }));

    return {
      ticks, books, ghosts,
      nightLabel: st.night ? '昼读' : '夜读',
      toggleNight: () => this.setState(x => {
        const n = !x.night;
        if (n) document.body.setAttribute('data-night', '1');
        else document.body.removeAttribute('data-night');
        return { night: n };
      })
    };
  }
}
</script>
</body>
</html>
